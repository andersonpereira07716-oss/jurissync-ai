<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisSync AI - Portal Jurídico SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex items-center justify-center">
    
    <!-- ECRÃ DE LOGIN / REGISTO -->
    <div id="auth-container" class="w-full max-w-md bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-emerald-400">⚖️ JurisSync AI</h1>
            <p class="text-xs text-slate-400">Plataforma SaaS Multi-tenant para Advogados</p>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
            <button onclick="mudarModoAuth('login')" id="btn-tab-login" class="py-2.5 rounded-lg bg-emerald-500 text-slate-950 transition-all font-bold">Entrar</button>
            <button onclick="mudarModoAuth('registar')" id="btn-tab-registar" class="py-2.5 rounded-lg text-slate-400 transition-all">Criar Conta</button>
        </div>

        <!-- Formulário de Login -->
        <div id="box-login" class="space-y-4">
            <input type="email" id="login-email" placeholder="E-mail do Escritório" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:border-emerald-500 outline-none">
            <input type="password" id="login-senha" placeholder="Palavra-passe" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:border-emerald-500 outline-none">
            <button onclick="fazerLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-xl transition-all shadow-lg shadow-emerald-500/10">Aceder ao Painel</button>
        </div>

        <!-- Formulário de Registo -->
        <div id="box-registar" class="space-y-4 hidden">
            <input type="text" id="reg-nome" placeholder="Nome do Escritório de Advocacia" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:border-emerald-500 outline-none">
            <input type="email" id="reg-email" placeholder="E-mail de Acesso" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:border-emerald-500 outline-none">
            <input type="password" id="reg-senha" placeholder="Palavra-passe Segura" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:border-emerald-500 outline-none">
            <button onclick="fazerRegisto()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-xl transition-all shadow-lg shadow-emerald-500/10">Registar Escritório</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (Oculto até fazer login) -->
    <div id="app-container" class="w-full max-w-2xl mx-auto space-y-6 hidden">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">⚖️ JurisSync AI</h1>
                <p id="label-escritorio" class="text-xs text-slate-400 font-medium"></p>
            </div>
            <button onclick="terminarSessao()" class="bg-slate-900 hover:bg-slate-800 text-rose-400 border border-rose-500/30 text-xs px-3 py-1.5 rounded-lg font-semibold transition-all">
                🚪 Sair
            </button>
        </header>

        <!-- Atalhos Rápidos de Teste -->
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">⚡ Preenchimento Rápido (Testes)</span>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="preencherExemplo('sentenca')" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 p-2 rounded-lg text-xs font-semibold text-left transition-all">
                    📄 Exemplo: Sentença Procedente
                </button>
                <button onclick="preencherExemplo('citacao')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 p-2 rounded-lg text-xs font-semibold text-left transition-all">
                    📬 Exemplo: Citação / Prazo
                </button>
            </div>
        </div>

        <!-- Formulário de Gestão -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-4">
            <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider">✨ Gestão & Automação de Processos</h2>
            
            <div class="flex gap-2">
                <input type="text" id="numero" placeholder="Número do Processo (CNJ)" class="flex-1 bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none">
                <button onclick="consultarDataJud()" id="btn-cnj" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all">
                    🔍 Capturar CNJ
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="cliente" placeholder="Nome do Cliente" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none">
                <input type="text" id="whatsapp" placeholder="WhatsApp (5583...)" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none">
            </div>

            <textarea id="movimentacao" placeholder="Cole ou capture o texto técnico do tribunal..." rows="3" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none"></textarea>
            
            <button onclick="traduzirComIA()" id="btn-ia" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-2.5 rounded-lg text-xs transition-all flex items-center justify-center gap-2">
                🤖 Traduzir Juridiquês com IA para o Cliente
            </button>

            <button onclick="enviarProcesso()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-lg transition-all shadow-lg shadow-emerald-500/10">Salvar e Atualizar Processo</button>
        </div>

        <!-- Timeline do Escritório -->
        <div class="space-y-3">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">📁 Timeline do Escritório</h3>
            <div id="lista-processos" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let tenantAtual = localStorage.getItem('tenant_id') || null;
        let nomeEscritorioAtual = localStorage.getItem('nome_escritorio') || null;

        if (tenantAtual) {
            mostrarApp(nomeEscritorioAtual);
        }

        function mudarModoAuth(modo) {
            const boxLogin = document.getElementById('box-login');
            const boxRegistar = document.getElementById('box-registar');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegistar = document.getElementById('btn-tab-registar');

            if (modo === 'login') {
                boxLogin.classList.remove('hidden');
                boxRegistar.classList.add('hidden');
                btnLogin.className = 'py-2.5 rounded-lg bg-emerald-500 text-slate-950 transition-all font-bold';
                btnRegistar.className = 'py-2.5 rounded-lg text-slate-400 transition-all';
            } else {
                boxLogin.classList.add('hidden');
                boxRegistar.classList.remove('hidden');
                btnRegistar.className = 'py-2.5 rounded-lg bg-emerald-500 text-slate-950 transition-all font-bold';
                btnLogin.className = 'py-2.5 rounded-lg text-slate-400 transition-all';
            }
        }

        async function fazerRegisto() {
            const nomeEscritorio = document.getElementById('reg-nome').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const senha = document.getElementById('reg-senha').value.trim();

            if (!nomeEscritorio || !email || !senha) {
                alert('Preencha todos os campos para registar!');
                return;
            }

            try {
                const res = await fetch('/api/auth/registar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nomeEscritorio, email, senha })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Escritório registado com sucesso! Faça login.');
                    mudarModoAuth('login');
                } else {
                    alert('Erro ao registar: ' + (data.error || 'Erro desconhecido.'));
                }
            } catch (e) {
                alert('Erro de conexão com o servidor ao registar.');
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            if (!email || !senha) {
                alert('Preencha o e-mail e a palavra-passe!');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('tenant_id', data.tenantId);
                    localStorage.setItem('nome_escritorio', data.nomeEscritorio);
                    tenantAtual = data.tenantId;
                    nomeEscritorioAtual = data.nomeEscritorio;
                    mostrarApp(data.nomeEscritorio);
                } else {
                    alert('Erro no login: ' + (data.error || 'Credenciais inválidas.'));
                }
            } catch (e) {
                alert('Erro de conexão com o servidor ao fazer login.');
            }
        }

        function mostrarApp(nome) {
            document.getElementById('auth-container').classList.add('hidden');
            const app = document.getElementById('app-container');
            app.classList.remove('hidden');
            document.body.classList.remove('items-center', 'justify-center');
            document.getElementById('label-escritorio').innerText = `Escritório: ${nome}`;
            carregarProcessos();
        }

        function terminarSessao() {
            localStorage.removeItem('tenant_id');
            localStorage.removeItem('nome_escritorio');
            location.reload();
        }

        function preencherExemplo(tipo) {
            if (tipo === 'sentenca') {
                document.getElementById('numero').value = '0801929-30.2024.8.15.0251';
                document.getElementById('cliente').value = 'Ana Maria Francisca da Silva';
                document.getElementById('whatsapp').value = '5583998765554';
                document.getElementById('movimentacao').value = 'Vistos, etc. Trata-se de ação ordinária... JULGO PROCEDENTE o pedido formulado na inicial para condenar a parte requerida ao pagamento da indenização por danos morais no valor de R$ 10.000,00, acrescido de juros e correção monetária. Publique-se. Registre-se. Intimem-se.';
            } else if (tipo === 'citacao') {
                document.getElementById('numero').value = '0802411-12.2024.8.15.0251';
                document.getElementById('cliente').value = 'Carlos Alberto Souza';
                document.getElementById('whatsapp').value = '5583988112233';
                document.getElementById('movimentacao').value = 'Certifico e dou fé que expedido o mandado de citação e intimação da parte requerida, o qual foi devidamente cumprido por Oficial de Justiça. Abre-se o prazo legal de 15 (quinze) dias úteis para apresentação de resposta/contestação, querendo.';
            }
        }

        async function consultarDataJud() {
            const numero = document.getElementById('numero').value;
            const btn = document.getElementById('btn-cnj');
            if (!numero) return;

            btn.innerText = '⌛...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/processos/consultar-cnj', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numeroProcesso: numero })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('movimentacao').value = data.ultimaMovimentacao;
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.innerText = '🔍 Capturar CNJ';
                btn.disabled = false;
            }
        }

        async function traduzirComIA() {
            const texto = document.getElementById('movimentacao').value;
            const btn = document.getElementById('btn-ia');
            if (!texto) return;

            btn.innerText = '🤖 A traduzir com IA...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/processos/traduzir-ia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ textoTecnico: texto })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('movimentacao').value = data.resumoTraduzido;
                    window.urgenciaTemp = data.urgencia;
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.innerText = '🤖 Traduzir Juridiquês com IA para o Cliente';
                btn.disabled = false;
            }
        }

        async function enviarNotificacaoBackground(telefone, cliente, numeroProcesso, mensagem) {
            try {
                const res = await fetch('/api/processos/notificar-whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone, cliente, numeroProcesso, mensagem })
                });
                const data = await res.json();
                if (data.modo === 'DEEP_LINK') {
                    window.open(data.link, '_blank');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function carregarProcessos() {
            if (!tenantAtual) return;
            try {
                const res = await fetch(`/api/processos?tenantId=${tenantAtual}`);
                const dados = await res.json();
                const container = document.getElementById('lista-processos');
                container.innerHTML = '';

                if (!Array.isArray(dados) || dados.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nenhum processo registado para este escritório.</p>';
                    return;
                }

                dados.forEach(p => {
                    let historicoHtml = '';
                    let ultimaMov = '';
                    if (Array.isArray(p.historico) && p.historico.length > 0) {
                        p.historico.forEach(h => {
                            ultimaMov = h.movimentacao || h.resumoCliente || '';
                            historicoHtml += `<div class="text-xs text-slate-300 mt-1 bg-slate-950 p-2 rounded border border-slate-800"><span class="text-emerald-400">[${h.data}]</span> ${ultimaMov}</div>`;
                        });
                    }

                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-mono text-emerald-400">${p.numero}</span>
                                <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${p.urgencia || 'Ativo'}</span>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-100">${p.cliente}</h4>
                                <p class="text-xs text-slate-400">Tel: ${p.whatsapp || 'Não informado'}</p>
                            </div>
                            <div class="space-y-1">${historicoHtml}</div>
                            ${p.whatsapp ? `
                                <button onclick="enviarNotificacaoBackground('${p.whatsapp}', '${p.cliente}', '${p.numero}', '${ultimaMov.replace(/'/g, "\\'")}')" class="flex items-center justify-center gap-2 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg text-xs transition-all shadow-md">
                                    🚀 Enviar Notificação WhatsApp (Background)
                                </button>
                            ` : ''}
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function enviarProcesso() {
            const numero = document.getElementById('numero').value;
            const cliente = document.getElementById('cliente').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const movimentacao = document.getElementById('movimentacao').value;

            if (!numero || !cliente || !tenantAtual) return;

            const payload = {
                id: Date.now().toString(),
                numero,
                cliente,
                whatsapp,
                urgencia: window.urgenciaTemp || 'Médio',
                status: 'Atualizado por IA',
                tenantId: tenantAtual,
                historico: [{ data: new Date().toLocaleDateString(), movimentacao }]
            };

            const res = await fetch('/api/processos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('numero').value = '';
                document.getElementById('cliente').value = '';
                document.getElementById('whatsapp').value = '';
                document.getElementById('movimentacao').value = '';
                window.urgenciaTemp = null;
                carregarProcessos();
            }
        }
    </script>
</body>
</html>
