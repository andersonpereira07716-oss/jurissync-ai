<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisSync AI - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-emerald-400">⚖️ JurisSync AI</h1>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-800">v2.3 IA Engine</span>
        </header>

        <!-- Formulário com IA e DataJud -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-4">
            <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider">✨ Tradutor Jurídico & IA</h2>
            
            <div class="flex gap-2">
                <input type="text" id="numero" placeholder="Número do Processo (CNJ)" class="flex-1 bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none">
                <button onclick="consultarDataJud()" id="btn-cnj" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all">
                    🔍 Capturar CNJ
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="cliente" placeholder="Nome do Cliente" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none">
                <input type="text" id="whatsapp" placeholder="WhatsApp (5583...)" class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none">
            </div>

            <textarea id="movimentacao" placeholder="Cole o texto técnico do tribunal aqui..." rows="3" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm focus:border-emerald-500 outline-none"></textarea>
            
            <button onclick="traduzirComIA()" id="btn-ia" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-2.5 rounded-lg text-xs transition-all flex items-center justify-center gap-2">
                🤖 Traduzir Juridiquês com IA para o Cliente
            </button>

            <button onclick="enviarProcesso()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-lg transition-all shadow-lg shadow-emerald-500/10">Processar e Atualizar</button>
        </div>

        <!-- Timeline / Lista -->
        <div class="space-y-3">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">📁 Processos & Timeline</h3>
            <div id="lista-processos" class="space-y-3"></div>
        </div>
    </div>

    <script>
        async function consultarDataJud() {
            const numero = document.getElementById('numero').value;
            const btn = document.getElementById('btn-cnj');
            if (!numero) { alert('Digite o número do processo!'); return; }

            btn.innerText = '⌛...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/processos/consultar-cnj', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numeroProcesso: numero })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('movimentacao').value = data.ultimaMovimentacao;
                    alert('Andamento capturado com sucesso!');
                } else {
                    alert(data.mensagem || 'Erro ao capturar.');
                }
            } catch (e) {
                alert('Erro de conexão.');
            } finally {
                btn.innerText = '🔍 Capturar CNJ';
                btn.disabled = false;
            }
        }

        async function traduzirComIA() {
            const texto = document.getElementById('movimentacao').value;
            const btn = document.getElementById('btn-ia');
            if (!texto) { alert('Insira ou capture um texto técnico primeiro!'); return; }

            btn.innerText = '🤖 A traduzir com IA...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/processos/traduzir-ia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ textoTecnico: texto })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('movimentacao').value = data.resumoTraduzido;
                    window.urgenciaTemp = data.urgencia;
                    alert('Tradução concluída com sucesso!');
                }
            } catch (e) {
                alert('Erro ao traduzir.');
            } finally {
                btn.innerText = '🤖 Traduzir Juridiquês com IA para o Cliente';
                btn.disabled = false;
            }
        }

        async function carregarProcessos() {
            try {
                const res = await fetch('/api/processos');
                const dados = await res.json();
                const container = document.getElementById('lista-processos');
                container.innerHTML = '';

                if (!Array.isArray(dados) || dados.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nenhum processo registado.</p>';
                    return;
                }

                dados.forEach(p => {
                    let historicoHtml = '';
                    let ultimaMov = '';
                    if (Array.isArray(p.historico) && p.historico.length > 0) {
                        p.historico.forEach(h => {
                            ultimaMov = h.movimentacao || h.resumoCliente || '';
                            historicoHtml += `<div class="text-xs text-slate-300 mt-1 bg-slate-950 p-2 rounded border border-slate-800"><span class="text-emerald-400">[${h.data}]</span> ${ultimaMov}</div>`;
                        });
                    }

                    const msgWhats = encodeURIComponent(`Olá, ${p.cliente}! Segue a atualização do seu processo nº ${p.numero}:\n\n"${ultimaMov}"\n\nQualquer dúvida, estamos à disposição!`);
                    const linkWhats = p.whatsapp ? `https://api.whatsapp.com/send?phone=${p.whatsapp}&text=${msgWhats}` : '#';

                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-mono text-emerald-400">${p.numero}</span>
                                <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${p.urgencia || 'Ativo'}</span>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-100">${p.cliente}</h4>
                                <p class="text-xs text-slate-400">Tel: ${p.whatsapp || 'Não informado'}</p>
                            </div>
                            <div class="space-y-1">${historicoHtml}</div>
                            ${p.whatsapp ? `
                                <a href="${linkWhats}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg text-xs transition-all shadow-md">
                                    💬 Enviar Atualização via WhatsApp
                                </a>
                            ` : ''}
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function enviarProcesso() {
            const numero = document.getElementById('numero').value;
            const cliente = document.getElementById('cliente').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const movimentacao = document.getElementById('movimentacao').value;

            if(!numero || !cliente) { alert('Preencha número e cliente!'); return; }

            const payload = {
                id: Date.now().toString(),
                numero,
                cliente,
                whatsapp,
                urgencia: window.urgenciaTemp || 'Médio',
                status: 'Atualizado por IA',
                historico: [{ data: new Date().toLocaleDateString(), movimentacao }]
            };

            const res = await fetch('/api/processos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert('Processo guardado e traduzido com sucesso!');
                document.getElementById('numero').value = '';
                document.getElementById('cliente').value = '';
                document.getElementById('whatsapp').value = '';
                document.getElementById('movimentacao').value = '';
                window.urgenciaTemp = null;
                carregarProcessos();
            }
        }

        carregarProcessos();
    </script>
</body>
</html>
