<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisSync AI - Gestão Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        neoncyan: '#06b6d4',
                        neonemerald: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans pb-12">
    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-neoncyan to-neonemerald bg-clip-text text-transparent">
                ⚖️ JurisSync AI
            </h1>
            <span class="text-xs bg-slate-800 text-neonemerald px-2.5 py-1 rounded-full border border-neonemerald/30 font-medium">v2.1 Pro</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Card de Cadastro / Nova Movimentação -->
        <section class="bg-cardbg border border-slate-800 rounded-xl p-4 shadow-xl">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">✨ Tradutor & Nova Movimentação</h2>
            <form id="processoForm" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Número do Processo</label>
                    <input type="text" id="numero" required placeholder="0001234-88.2026.8.15.0001" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:border-neoncyan focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Cliente</label>
                        <input type="text" id="cliente" required placeholder="Nome do Cliente" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:border-neoncyan focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">WhatsApp</label>
                        <input type="text" id="whatsapp" required placeholder="5583999999999" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:border-neoncyan focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Novo Andamento do Tribunal</label>
                    <textarea id="movimentacao" rows="3" required placeholder="Cole o texto técnico aqui..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:border-neoncyan focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-neoncyan to-neonemerald text-slate-950 font-bold py-2.5 rounded-lg text-sm shadow-lg hover:opacity-90 transition">
                    Processar e Atualizar
                </button>
            </form>
        </section>

        <!-- Filtros e Barra de Pesquisa -->
        <section class="space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">📁 Processos & Timeline</h2>
                <div class="flex gap-1.5 text-xs">
                    <button onclick="filtrar('TODOS')" id="btn-todos" class="px-2.5 py-1 bg-neoncyan text-slate-950 font-bold rounded-md transition">Todos</button>
                    <button onclick="filtrar('Alto')" id="btn-alto" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md hover:bg-slate-700 transition">Urgentes</button>
                    <button onclick="filtrar('Médio')" id="btn-medio" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md hover:bg-slate-700 transition">Médios</button>
                </div>
            </div>

            <!-- Nova Barra de Pesquisa -->
            <div>
                <input type="text" id="inputBusca" oninput="renderizarProcessos()" placeholder="🔍 Pesquisar por cliente ou número..." class="w-full bg-cardbg border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:border-neoncyan focus:outline-none">
            </div>

            <div id="listaProcessos" class="space-y-4">
                <!-- Inserido via JS -->
            </div>
        </section>
    </main>

    <script>
        let processosGlobais = [];
        let filtroAtual = 'TODOS';

        async function carregarProcessos() {
            try {
                const res = await fetch('/api/processos');
                processosGlobais = await res.json();
                renderizarProcessos();
            } catch (err) {
                console.error("Erro ao carregar:", err);
            }
        }

        function filtrar(tipo) {
            filtroAtual = tipo;
            ['todos', 'alto', 'medio'].forEach(b => {
                const el = document.getElementById(`btn-${b}`);
                if (b === tipo.toLowerCase() || (b === 'todos' && tipo === 'TODOS')) {
                    el.className = "px-2.5 py-1 bg-neoncyan text-slate-950 font-bold rounded-md transition";
                } else {
                    el.className = "px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md hover:bg-slate-700 transition";
                }
            });
            renderizarProcessos();
        }

        function copiarRelatorio(cliente, numero, status, resumo) {
            const texto = `📋 *Relatório Processual - JurisSync AI*\n👤 Cliente: ${cliente}\n⚖️ Processo: ${numero}\n📌 Status: ${status}\n\n💬 *Última Atualização:*\n${resumo}`;
            navigator.clipboard.writeText(texto).then(() => {
                alert("Relatório copiado para a área de transferência!");
            });
        }

        function renderizarProcessos() {
            const container = document.getElementById('listaProcessos');
            const termoBusca = document.getElementById('inputBusca').value.toLowerCase();
            container.innerHTML = '';

            const filtrados = processosGlobais.filter(p => {
                const matchUrgencia = (filtroAtual === 'TODOS' || p.urgencia === filtroAtual);
                const matchTexto = p.cliente.toLowerCase().includes(termoBusca) || p.numero.toLowerCase().includes(termoBusca);
                return matchUrgencia && matchTexto;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum processo encontrado.</p>`;
                return;
            }

            filtrados.forEach(p => {
                const ultima = p.historico[0];
                const msgWpp = encodeURIComponent(`Olá, ${p.cliente}! Passando para atualizar sobre o seu processo (${p.numero}). ${ultima.resumoCliente} Qualquer dúvida estou à disposição!`);
                
                let timelineHtml = '';
                p.historico.forEach((h, index) => {
                    const corBorda = index === 0 ? 'border-neoncyan bg-slate-900/80' : 'border-slate-800 bg-slate-900/30 opacity-75';
                    timelineHtml += `
                        <div class="border-l-2 ${corBorda} pl-3 py-1 space-y-1">
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span>📅 ${h.data}</span>
                                ${index === 0 ? '<span class="text-neoncyan font-bold">Mais Recente</span>' : ''}
                            </div>
                            <p class="text-xs text-slate-200 font-medium">${h.resumoCliente}</p>
                        </div>
                    `;
                });

                const badgeCor = p.urgencia === 'Alto' ? 'bg-red-500/20 text-red-400 border-red-500/30' : (p.urgencia === 'Médio' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-slate-800 text-slate-300 border-slate-700');

                const card = document.createElement('div');
                card.className = "bg-cardbg border border-slate-800 rounded-xl p-4 shadow-lg space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs text-neoncyan font-mono">${p.numero}</span>
                            <h3 class="font-bold text-slate-100 text-base">${p.cliente}</h3>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded-full border ${badgeCor}">${p.status}</span>
                    </div>

                    <div class="space-y-2 pt-1">
                        <p class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Timeline de Andamentos:</p>
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                            ${timelineHtml}
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-800 flex justify-between items-center gap-2">
                        <button onclick="copiarRelatorio('${p.cliente}', '${p.numero}', '${p.status}', \`${ultima.resumoCliente}\`)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium px-2.5 py-2 rounded-lg border border-slate-700 transition">
                            📋 Copiar Resumo
                        </button>
                        <a href="https://wa.me/${p.whatsapp}?text=${msgWpp}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
                            💬 WhatsApp
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('processoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                numero: document.getElementById('numero').value,
                cliente: document.getElementById('cliente').value,
                whatsapp: document.getElementById('whatsapp').value,
                movimentacao: document.getElementById('movimentacao').value
            };

            const res = await fetch('/api/processos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                document.getElementById('movimentacao').value = '';
                carregarProcessos();
            }
        });

        carregarProcessos();
    </script>
</body>
</html>
